name: Regression tests

on:
  pull_request:
    branches: [main, fix/safe-sync-and-backup-permissions]

permissions:
  contents: read

jobs:
  regression:
    name: Node 24 regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the immutable PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify tested commit
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          echo "Tested commit: $EXPECTED_HEAD"
          echo "Tested tree: $(git rev-parse HEAD^{tree})"
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run automated regression tests
        run: npm test
