<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PPM Field Pro</title><meta name="theme-color" content="#0f172a"><style>body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#0f172a;color:white;display:grid;place-items:center;min-height:100vh}.box{text-align:center;padding:24px;max-width:720px}.spinner{width:42px;height:42px;border:4px solid #ffffff33;border-top-color:white;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#cbd5e1}.err{background:#7f1d1d;padding:14px;border-radius:10px;margin-top:16px}</style></head><body><div class="box"><div class="spinner"></div><h2>PPM Field Pro</h2><small>Loading Lombard Building asset database…</small><div id="msg"></div></div><script>(async()=>{try{if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const r of regs)await r.unregister()}if('caches' in window){for(const k of await caches.keys())await caches.delete(k)}if(navigator.serviceWorker&&navigator.serviceWorker.controller&&!location.search.includes('clean=1')){location.replace(location.pathname+'?clean=1&v=6');return}const files=['app-payload-1.txt','app-payload-2.txt','app-payload-3.txt','app-payload-4.txt'];const parts=[];for(const f of files){parts.push(await new Promise((resolve,reject)=>{const fr=document.createElement('iframe');fr.style.display='none';fr.src='./'+f+'?v=6';fr.onload=()=>{try{const t=(fr.contentDocument?.body?.innerText||'').trim();fr.remove();if(!t||t.startsWith('<!doctype')||t.includes('404'))reject(new Error(f+' unavailable'));else resolve(t)}catch(e){reject(e)}};fr.onerror=()=>reject(new Error(f+' could not load'));document.body.appendChild(fr)}))}const b64=parts.join('').replace(/\s+/g,'');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(typeof DecompressionStream==='undefined')throw new Error('Chrome needs updating before this app can open');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.querySelector('.spinner')?.remove();document.getElementById('msg').innerHTML='<div class="err"><b>PPM Field Pro could not load.</b><br><br>'+String(e)+'<br><br>In Chrome, clear site data for this address once, then reopen it.</div>';console.error(e)}})();</script></body></html>
