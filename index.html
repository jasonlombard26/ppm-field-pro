<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PPM Field Pro</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f172a"><style>body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#0f172a;color:white;display:grid;place-items:center;min-height:100vh}.box{text-align:center;padding:24px}.spinner{width:42px;height:42px;border:4px solid #ffffff33;border-top-color:white;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#cbd5e1}</style></head><body><div class="box"><div class="spinner"></div><h2>PPM Field Pro</h2><small>Loading Lombard Building asset database…</small></div><script>(async()=>{try{const files=['app-payload-1.txt','app-payload-2.txt','app-payload-3.txt','app-payload-4.txt'];const parts=await Promise.all(files.map(f=>fetch('./'+f).then(r=>{if(!r.ok)throw new Error(f+' '+r.status);return r.text()})));const b64=parts.join('').trim();const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="box"><h2>PPM Field Pro could not load</h2><p>'+String(e)+'</p><p>Please refresh while connected to the internet.</p></div>';console.error(e)}})();</script></body></html>
