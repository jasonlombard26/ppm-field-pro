<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PPM Field Pro</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0f172a"><style>body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#0f172a;color:white;display:grid;place-items:center;min-height:100vh}.box{text-align:center;padding:24px;max-width:720px}.spinner{width:42px;height:42px;border:4px solid #ffffff33;border-top-color:white;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#cbd5e1}.err{color:#fecaca}</style></head><body><div class="box"><div class="spinner"></div><h2>PPM Field Pro</h2><small>Loading Lombard Building asset database…</small></div><script>(async()=>{const files=['app-payload-1.txt','app-payload-2.txt','app-payload-3.txt','app-payload-4.txt'];async function getPart(f){const candidates=['./'+f,'https://raw.githubusercontent.com/jasonlombard26/ppm-field-pro/main/'+f];let last;for(const u of candidates){try{const r=await fetch(u,{cache:'no-store'});if(r.ok)return await r.text();last=new Error(f+' HTTP '+r.status)}catch(e){last=e}}throw new Error(f+': '+(last?.message||'failed to fetch'))}try{const parts=[];for(const f of files)parts.push(await getPart(f));const b64=parts.join('').replace(/\s+/g,'');if(b64.length!==36000)throw new Error('Payload length '+b64.length+' (expected 36000)');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(typeof DecompressionStream==='undefined')throw new Error('This Chrome version does not support gzip decompression. Please update Chrome.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="box"><h2>PPM Field Pro could not load</h2><p class="err">'+String(e)+'</p><p>Make sure mobile data or Wi-Fi is on, then refresh. If it still fails, update Chrome and try again.</p></div>';console.error(e)}})();</script></body></html>
