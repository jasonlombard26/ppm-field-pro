<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>PPM Field Pro Desktop</title><meta name="theme-color" content="#0f172a"><style>body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#0f172a;color:white;display:grid;place-items:center;min-height:100vh}.box{text-align:center;padding:24px;max-width:720px}.spinner{width:42px;height:42px;border:4px solid #ffffff33;border-top-color:white;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{color:#cbd5e1}.err{background:#7f1d1d;padding:14px;border-radius:10px;margin-top:16px}</style></head><body><div class="box"><div class="spinner"></div><h2>PPM Field Pro Desktop</h2><small>Loading shared site database…</small><div id="msg"></div></div><script>(async()=>{try{const files=['app-payload-1.txt','fix2a.txt','fix2b.txt','app-payload-3.txt','app-payload-4.txt'];const parts=[];for(const f of files){parts.push(await new Promise((resolve,reject)=>{const fr=document.createElement('iframe');fr.style.display='none';fr.src='./'+f+'?v=11';fr.onload=()=>{try{const t=(fr.contentDocument?.body?.innerText||'').trim();fr.remove();if(!t||t.startsWith('<!doctype')||t.includes('404'))reject(new Error(f+' unavailable'));else resolve(t)}catch(e){reject(e)}};fr.onerror=()=>reject(new Error(f+' could not load'));document.body.appendChild(fr)}))}const b64=parts.join('').replace(/\s+/g,'');const bin=atob(b64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);if(typeof DecompressionStream==='undefined')throw new Error('Chrome or Edge needs updating before this app can open');const ds=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const reader=ds.getReader();const decoder=new TextDecoder();let html='';while(true){const {value,done}=await reader.read();if(done)break;html+=decoder.decode(value,{stream:true})}html+=decoder.decode();if(!html.includes('PPM Field Pro')||!html.includes('Lombard Building'))throw new Error('App data validation failed');html=html.replace('</body>','<script src="./multisite-v5.js?v=6"><\/script><script src="./sites-v6.js?v=7"><\/script><script src="./latest-notes-v7.js?v=1"><\/script><script src="./field-updates-v10.js?v=2"><\/script><script src="./lock-dropdown-v11.js?v=2"><\/script><script src="./site-tabs-v8.js?v=1"><\/script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"><\/script><script src="./supabase-config.js?v=1"><\/script><script src="./supabase-sync.js?v=1"><\/script><script src="./cloud-photos-v8.js?v=2"><\/script><script src="./photo-viewer-v9.js?v=1"><\/script><script src="./photo-display-v12.js?v=5"><\/script><script src="./photo-actions-v15.js?v=3"><\/script><script src="./record-view-v20.js?v=3"><\/script><script src="./pc-ui-v1.js?v=2"><\/script></body>');document.open();document.write(html);document.close()}catch(e){document.querySelector('.spinner')?.remove();document.getElementById('msg').innerHTML='<div class="err"><b>PPM Field Pro Desktop could not load.</b><br><br>'+String(e)+'<br><br>Please send me a screenshot of this exact message.</div>';console.error(e)}})();</script></body></html>
